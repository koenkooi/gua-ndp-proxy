name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install meson ninja
      # Recent Ubuntu images restrict unprivileged user namespaces, which the
      # integration test needs; without this it would be skipped.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: meson setup build -Dgadget-subnet=true
      - run: meson test -C build --print-errorlogs

  minimum-meson:
    name: Oldest supported Meson
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install meson==0.61.5 ninja
      - run: meson setup build -Dgadget-subnet=true
      - run: meson compile -C build
      - run: meson install -C build --destdir "$PWD/stage"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src tests
      - run: shellcheck -x contrib/usb-gadget-subnet/usb-gadget-subnet.sh tests/*.sh
