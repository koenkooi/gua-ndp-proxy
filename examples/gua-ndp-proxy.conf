# Install as /etc/gua-ndp-proxy/gua-ndp-proxy.conf; see docs/configuration.md.
[main]
# Interface facing the LAN.
uplink = eth0

# The delegated /64, or "auto" to follow the uplink's global address.
prefix = auto

# Interfaces or bridges to watch, space separated.
#downstream = br-pan

# Also watch any interface bound to one of these kernel drivers
# ("none" disables). Defaults to the common USB network gadget drivers.
#gadget_drivers = cdc_ether rndis_host cdc_ncm

#interval = 30
#max_per_interface = 8
